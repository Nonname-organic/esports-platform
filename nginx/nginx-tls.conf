# HTTPS版 nginx 設定（CloudFront を使わない無料構成用 / Let's Encrypt でTLS終端）。
#
# 使い方:
#   1. ドメインは app.axelia-esports.jp（ConoHa VPS の本番）で設定済み。
#      別ドメインにする場合は全置換する:
#        sed -i 's/app\.axelia-esports\.jp/新しいドメイン/g' nginx/nginx-tls.conf
#   2. 証明書発行後、docker-compose.tls.yml を重ねて起動:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# 詳細手順: docs/phase10_vps_conoha.md

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker内部DNSで動的解決（コンテナ再起動後もIPを追跡）
    resolver 127.0.0.11 valid=5s ipv6=off;

    # HTTP: ACMEチャレンジのみ許可し、他は HTTPS へリダイレクト
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.axelia-esports.jp;

        # セキュリティヘッダはここにまとめる。nginx の add_header は
        # 下位ブロックに1つでも add_header があると上位ぶんが全部消えるため、
        # http レベルに置くと location 側の指定で黙って無効化される。
        # （実際それで X-Frame-Options 等が返っていなかった）
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # script-src は Next.js のインラインに引っかかるため入れない。
        # 乗っ取り系（クリックジャッキング・フォーム送信先の差し替え・
        # プラグイン埋め込み）だけを塞ぐ
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # 限定公開デモ: 検索エンジンにインデックスさせない（アプリ側のnoindexと三重防御）
        add_header X-Robots-Tag "noindex, nofollow" always;

        ssl_certificate     /etc/letsencrypt/live/app.axelia-esports.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.axelia-esports.jp/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 1h;

        # APIプロキシ（変数でproxy_passするとDNSが動的解決される）
        location /api/ {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $proxy_add_x_forwarded_for は client 送信ぶんに追記するため、
            # 偽装された値が先頭に残る。手前は nginx だけなので上書きする
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /ws/ {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
        }

        location /docs {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
        }

        location /health {
            set $api_host api:8000;
            proxy_pass http://$api_host;
        }

        location / {
            set $frontend_host frontend:3000;
            proxy_pass http://$frontend_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
