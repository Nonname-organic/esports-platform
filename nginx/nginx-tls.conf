# HTTPS版 nginx 設定（CloudFront を使わない無料構成用 / Let's Encrypt でTLS終端）。
#
# 使い方:
#   1. YOUR_DOMAIN を実際のドメインに置換:
#        sed -i 's/YOUR_DOMAIN/example.duckdns.org/g' nginx/nginx-tls.conf
#   2. 証明書発行後、docker-compose.tls.yml を重ねて起動:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# 詳細手順: docs/phase10_demo_free_tier.md

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Docker内部DNSで動的解決（コンテナ再起動後もIPを追跡）
    resolver 127.0.0.11 valid=5s ipv6=off;

    # HTTP: ACMEチャレンジのみ許可し、他は HTTPS へリダイレクト
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 1h;

        # APIプロキシ（変数でproxy_passするとDNSが動的解決される）
        location /api/ {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /ws/ {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /docs {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api_host api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
        }

        location /health {
            set $api_host api:8000;
            proxy_pass http://$api_host;
        }

        location / {
            set $frontend_host frontend:3000;
            proxy_pass http://$frontend_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
