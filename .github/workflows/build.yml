name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for manual rebuild
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  tag:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    name: Build — ${{ matrix.service }}
    needs: tag
    runs-on: ubuntu-latest
    # step の if から参照するため、シークレットを env に写す（未設定なら空文字）
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./backend
            target: production
          - service: worker
            context: ./backend
            target: worker
          - service: frontend
            context: ./frontend
            target: ""
            # Next.js の NEXT_PUBLIC_* はビルド時に埋め込まれる。渡さないと
            # 空になり、デモ環境である旨のバナーが出なくなる（実際に出ていなかった）。
            # 実データを載せる段階で vars.NEXT_PUBLIC_DEMO_MODE を false にする。
            build-args: NEXT_PUBLIC_DEMO_MODE=${{ vars.NEXT_PUBLIC_DEMO_MODE || 'true' }}
    steps:
      - uses: actions/checkout@v4

      # amd64 のみのビルドになったため QEMU によるクロスビルドは不要。
      # buildx のビルダーは Docker Hub から moby/buildkit を引くので、
      # そこでも Docker Hub のレート制限・接続不調の影響を受ける。
      - uses: docker/setup-buildx-action@v3

      # Docker Hub は未認証だとIP単位で厳しく絞られ、GitHub のランナーは
      # IPを共有するため 429 や取得タイムアウトに当たりやすい。
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN があれば認証して上限を上げる。
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || '' }}
          build-args: ${{ matrix.build-args || '' }}
          push: true
          # ConoHa VPS は x86 のみ。ARM向けビルドは Oracle(ARM) 構成をやめた時点で不要になった。
          # 2アーキ分のベースイメージを引くと Docker Hub のレート制限(429)に当たりやすい。
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/esports-platform-${{ matrix.service }}:${{ needs.tag.outputs.image-tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/esports-platform-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
