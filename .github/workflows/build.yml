name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for manual rebuild
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  tag:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    name: Build — ${{ matrix.service }}
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./backend
            target: production
          - service: worker
            context: ./backend
            target: worker
          - service: frontend
            context: ./frontend
            target: ""
    steps:
      - uses: actions/checkout@v4

      # ARM64 (Oracle Cloud A1 等) 向けクロスビルド用
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || '' }}
          push: true
          # amd64 = EC2等 / arm64 = Oracle Cloud Always Free (Ampere A1)
          platforms: linux/amd64,linux/arm64
          # Hero 背景動画のURL（frontend のみ使用 / 他サービスでは未宣言ARGとして無視される）。
          # GitHub Settings → Variables に HERO_VIDEO_MP4 等を設定するとビルド時に埋め込まれる。
          build-args: |
            NEXT_PUBLIC_HERO_VIDEO_MP4=${{ vars.HERO_VIDEO_MP4 }}
            NEXT_PUBLIC_HERO_VIDEO_WEBM=${{ vars.HERO_VIDEO_WEBM }}
            NEXT_PUBLIC_HERO_VIDEO_TABLET=${{ vars.HERO_VIDEO_TABLET }}
            NEXT_PUBLIC_HERO_VIDEO_MOBILE=${{ vars.HERO_VIDEO_MOBILE }}
            NEXT_PUBLIC_HERO_POSTER=${{ vars.HERO_POSTER }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/esports-platform-${{ matrix.service }}:${{ needs.tag.outputs.image-tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/esports-platform-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
