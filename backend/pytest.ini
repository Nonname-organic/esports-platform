[pytest]
asyncio_mode = strict
testpaths = tests

# backend/ を import 元に加える。コンソールスクリプトの `pytest` は
# カレントディレクトリを sys.path に入れないため、これが無いと
# CI で conftest.py が `app` を import できずに落ちる
# （`python -m pytest` では cwd が入るので手元では気付きにくい）。
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    security: OWASP/セキュリティ系テスト
    contract: OpenAPI契約テスト
    slow: 低速テスト
filterwarnings =
    ignore::DeprecationWarning

# カバレッジは CI / 明示実行で:
#   pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90
