# Production image override: replaces build: contexts with pre-built GHCR images.
#
# Usage (EC2 deploy):
#   IMAGE_TAG=sha-abc1234 IMAGE_ORG=your-org \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# IMAGE_TAG and IMAGE_ORG are set by the CI deploy workflow via SSH env vars.
version: "3.9"

# 本番だけの設定（api / worker / scheduler 共通）:
#   REQUIRE_STRONG_SECRETS — DB パスワードが空・既定値、SECRET_KEY が見本値なら起動しない
#   USE_REDIS_QUEUE       — キューは Redis。未設定だと AWS SQS に向かうため .env に頼らず固定する
services:
  api:
    image: ghcr.io/${IMAGE_ORG}/esports-platform-api:${IMAGE_TAG:-latest}
    build: null
    environment:
      - REQUIRE_STRONG_SECRETS=true
      - USE_REDIS_QUEUE=true

  worker:
    image: ghcr.io/${IMAGE_ORG}/esports-platform-worker:${IMAGE_TAG:-latest}
    build: null
    environment:
      - REQUIRE_STRONG_SECRETS=true
      - USE_REDIS_QUEUE=true

  # scheduler は api と同一イメージ（production ターゲット）を使う
  scheduler:
    image: ghcr.io/${IMAGE_ORG}/esports-platform-api:${IMAGE_TAG:-latest}
    build: null
    environment:
      - REQUIRE_STRONG_SECRETS=true
      - USE_REDIS_QUEUE=true

  # 既定値（esports_pass）での初期化を許さない。/opt/app/.env に DB_PASSWORD が無いと
  # compose がその場で止まり、稼働中のコンテナには触れない
  postgres:
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD を /opt/app/.env に設定してください}"

  frontend:
    image: ghcr.io/${IMAGE_ORG}/esports-platform-frontend:${IMAGE_TAG:-latest}
    build: null
